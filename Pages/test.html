<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Professional Experience Timeline</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #040D12;
            margin: 0;
            line-height: 1.6;
            color: #FFF;
        }
        .experience-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #040D12;
            box-shadow: 0 4px 6px rgba(186, 186, 186, 0.1);
            border-radius: 8px;
        }
        .timeline {
            position: relative;
            padding-left: 50px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 1rem;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: #93B1A6;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 30px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.5rem;
            top: 0.5rem;
            width: 1rem;
            height: 1rem;
            background-color: #93B1A6;
            /*border: 4px solid #183D3D;*/
            border-radius: 50%;
        }
        .job-title {
            font-size: 18px;
            font-weight: 600;
            color: #c1c1c1;
            margin-bottom: 5px;
        }
        .company-details {
            font-size: 16px;
            color: #c1c1c1;
            margin-bottom: 10px;
        }
        .job-description {
            font-size: 15px;
            color: #c1c1c1;
            margin-bottom: 10px;
        }
        .achievements {
            padding-left: 20px;
            margin-top: 10px;
        }
        .achievements li {
            font-size: 14px;
            color: #c3c1c1;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="experience-container">
        <section class="experience-grid grid grid-cols-3 grid-rows-3 gap-4 p-6">
            <!-- Years of Experience -->
            <div class="experience-item bg-[#183D3D] text-white rounded-lg p-6 col-span-2 row-span-2 border border-[#93B1A6]">
              <h2 class="text-4xl font-bold mb-2">Years of Experience</h2>
              <p class="text-6xl">5+</p>
            </div>
      
            <!-- Design Expertise -->
            <div class="experience-item bg-[#040D12] text-white rounded-lg p-6 border border-[#93B1A6]">
              <h2 class="text-2xl font-bold mb-2">Design Expertise</h2>
              <p class="text-lg">Advanced</p>
            </div>
      
            <!-- Machine Learning Proficiency -->
            <div class="experience-item bg-[#183D3D] text-white rounded-lg p-6 row-span-2 border border-[#93B1A6]">
              <h2 class="text-2xl font-bold mb-2">Machine Learning</h2>
              <p class="text-lg">Proficient</p>
            </div>
      
            <!-- Multi-skill Versatility -->
            <div class="experience-item bg-[#040D12] text-white rounded-lg p-6 col-span-2 border border-[#93B1A6]">
              <h2 class="text-2xl font-bold mb-2">Multi-skill Versatility</h2>
              <p class="text-lg">Flexible & Diverse</p>
            </div>
          </section>
</body>
</html>
